services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
      SECRET_KEY: change-me
      JWT_SECRET_KEY: change-me-too
      DATABASE_URL: postgresql://bookstore:bookstore@db:5432/bookstore
      JWT_ACCESS_TOKEN_EXPIRES: 900
      JWT_REFRESH_TOKEN_EXPIRES: 604800
      CORS_ORIGINS: http://localhost:5172,http://localhost:5173,http://localhost:5174
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations

  landing:
    build:
      context: ./frontend/landing
      dockerfile: Dockerfile
    ports:
      - "5172:5172"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
      VITE_LANDING_URL: http://localhost:5172
      VITE_SELLER_PORTAL_URL: http://localhost:5173
      VITE_BUYER_PORTAL_URL: http://localhost:5174
    depends_on:
      - backend
    volumes:
      - ./frontend/landing/src:/app/src
      - ./frontend/shared:/app/../shared

  buyer-portal:
    build:
      context: ./frontend/buyer-portal
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
      VITE_LANDING_URL: http://localhost:5172
      VITE_SELLER_PORTAL_URL: http://localhost:5173
      VITE_BUYER_PORTAL_URL: http://localhost:5174
    depends_on:
      - backend
    volumes:
      - ./frontend/buyer-portal/src:/app/src
      - ./frontend/shared:/app/../shared

  seller-portal:
    build:
      context: ./frontend/seller-portal
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
      VITE_LANDING_URL: http://localhost:5172
      VITE_SELLER_PORTAL_URL: http://localhost:5173
      VITE_BUYER_PORTAL_URL: http://localhost:5174
    depends_on:
      - backend
    volumes:
      - ./frontend/seller-portal/src:/app/src
      - ./frontend/shared:/app/../shared

volumes:
  postgres_data:
